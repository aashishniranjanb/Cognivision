spring.application.name=attendance-backend

# ===============================
# PostgreSQL Database (Original - Uncomment when Postgres is ready)
# ===============================
# spring.datasource.url=jdbc:postgresql://localhost:5432/attendance_db
# spring.datasource.username=postgres
# spring.datasource.password=Arjun@123.

# ===============================
# H2 In-Memory Database (Dev Fallback)
# ===============================
spring.datasource.url=jdbc:h2:mem:attendancedb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.h2.console.enabled=true


# ===============================
# JPA / Hibernate
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ===============================
# Server
# ===============================
server.port=8080